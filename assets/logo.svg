<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="280" height="280" role="img" aria-label="harvey">
  <title>harvey</title>
  <desc>A flat, low-resolution grey-and-white rabbit on a solid dark chrome background.</desc>

  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#37414c"/>
      <stop offset="0.5"  stop-color="#1c232b"/>
      <stop offset="1"    stop-color="#0d1217"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark chrome panel with a thin bezel -->
  <rect x="20" y="20" width="380" height="380" rx="72" fill="url(#chrome)"/>
  <rect x="20" y="20" width="380" height="380" rx="72" fill="url(#sheen)"/>
  <rect x="20.5" y="20.5" width="379" height="379" rx="71.5" fill="none" stroke="#05080b" stroke-width="2"/>
  <rect x="25"   y="25"   width="370" height="370" rx="67"   fill="none" stroke="#5f6b77" stroke-width="2" opacity="0.5"/>

  <!-- Soft grounding shadow under Fred -->
  <ellipse cx="214" cy="322" rx="118" ry="16" fill="#000000" opacity="0.22"/>

  <!-- Fred: grey body, white tail + chest -->
  <g>
    <!-- Grey silhouette: ears, head, body -->
    <g fill="#b9bfc5">
      <rect x="234" y="106" width="32"  height="48"/>
      <rect x="282" y="106" width="32"  height="48"/>
      <rect x="218" y="154" width="96"  height="16"/>
      <rect x="202" y="170" width="112" height="32"/>
      <rect x="170" y="202" width="144" height="16"/>
      <rect x="154" y="218" width="144" height="48"/>
      <rect x="170" y="266" width="128" height="16"/>
      <rect x="170" y="282" width="112" height="16"/>
      <rect x="186" y="298" width="80"  height="16"/>
    </g>

    <!-- Soft bottom shade for depth -->
    <g fill="#a3a9af">
      <rect x="170" y="282" width="112" height="16"/>
      <rect x="186" y="298" width="80"  height="16"/>
    </g>

    <!-- White tail (back) -->
    <g fill="#f4f4f2">
      <rect x="122" y="234" width="32" height="16"/>
      <rect x="106" y="250" width="48" height="16"/>
      <rect x="122" y="266" width="32" height="16"/>
    </g>

    <!-- White chest and front paw -->
    <g fill="#f4f4f2">
      <rect x="234" y="250" width="32" height="16"/>
      <rect x="234" y="266" width="48" height="16"/>
      <rect x="234" y="282" width="32" height="16"/>
    </g>

    <!-- Pink inner ears -->
    <rect x="250" y="122" width="16" height="32" fill="#f2a8b0"/>
    <rect x="282" y="122" width="16" height="32" fill="#f2a8b0"/>

    <!-- Top-edge highlights for form -->
    <g fill="#d4d8dc">
      <rect x="234" y="106" width="32" height="6"/>
      <rect x="282" y="106" width="32" height="6"/>
      <rect x="202" y="170" width="28" height="4"/>
      <rect x="154" y="218" width="28" height="4"/>
    </g>

    <!-- Thin definition lines -->
    <g fill="#7e858c">
      <rect x="248" y="180" width="20" height="4"/>   <!-- brow -->
      <rect x="288" y="220" width="20" height="4"/>   <!-- mouth -->
      <rect x="246" y="246" width="48" height="4"/>   <!-- neck -->
      <rect x="208" y="248" width="4"  height="46"/>  <!-- back-leg seam -->
    </g>
    <rect x="258" y="266" width="4" height="30" fill="#c4c9ce"/> <!-- front-leg crease -->

    <!-- Eye and nose -->
    <rect x="250" y="186" width="16" height="16" fill="#161b21"/>
    <rect x="252" y="188" width="5"  height="5"  fill="#ffffff"/>
    <rect x="298" y="202" width="16" height="16" fill="#ec8a94"/>
  </g>
</svg>
