name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: vet, build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  e2e-podman:
    name: e2e (podman, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Ensure podman is installed
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
      - name: End-to-end suite (podman)
        run: ./scripts/test.sh podman

# Apple `container` cannot run on hosted runners: `container system start` prompts
# interactively on first start, and the runners lack the nested virtualization that
# Virtualization.framework VMs need (verified 2026-07-09; an experimental job died on
# both). The authoritative Apple-container check is `scripts/e2e-all.sh` on a real Mac.
